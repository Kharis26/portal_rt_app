<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal RT Digital 05</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-emerald-600 text-white rounded-full flex items-center justify-center font-bold text-xl mx-auto mb-3">
            RT
        </div>
        <h1 class="text-xl font-bold text-slate-800" id="namaRt">RT Digital</h1>
        <p class="text-sm text-slate-500 mb-6" id="lokasiRt">Memuat data wilayah...</p>

        <form id="loginForm" class="space-y-4 text-left">
            <div>
                <label class="text-xs font-semibold text-slate-600 uppercase">Email / NIK</label>
                <input type="text" id="email" required placeholder="Masukkan Email/NIK" class="w-full mt-1 p-3 border border-slate-300 rounded-lg text-sm focus:outline-emerald-600">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-600 uppercase">Kata Sandi</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full mt-1 p-3 border border-slate-300 rounded-lg text-sm focus:outline-emerald-600">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">
                Masuk
            </button>
        </form>
    </div>

    <script type="module">
        import { tesKoneksi } from './app.js';

        async function init() {
            const data = await tesKoneksi();
            if (data) {
                document.getElementById('namaRt').innerText = `RT ${data.rt} / RW ${data.rw}`;
                document.getElementById('lokasiRt').innerText = `${data.desa_kelurahan}, ${data.kabupaten_kota}`;
            } else {
                document.getElementById('lokasiRt').innerText = 'Gagal terhubung ke database';
            }
        }
        init();
    </script>
</body>
</html>
