
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <title>Portal RT Digital 05</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-emerald-600 text-white rounded-full
                    flex items-center justify-center font-bold text-xl mx-auto mb-3">
            RT
        </div>

        <h1 id="namaRt" class="text-xl font-bold text-slate-800">RT Digital</h1>
        <p id="lokasiRt" class="text-sm text-slate-500 mb-6">
            Memuat data wilayah...
        </p>

        <form id="loginForm" class="space-y-4 text-left">
            <div>
                <label for="email" class="text-xs font-semibold text-slate-600 uppercase">
                    Email
                </label>
                <input id="email" type="email" required autocomplete="username"
                    placeholder="Masukkan email terdaftar"
                    class="w-full mt-1 p-3 border border-slate-300 rounded-lg text-sm">
            </div>

            <div>
                <label for="password" class="text-xs font-semibold text-slate-600 uppercase">
                    Kata Sandi
                </label>
                <input id="password" type="password" required
                    autocomplete="current-password"
                    placeholder="Masukkan kata sandi"
                    class="w-full mt-1 p-3 border border-slate-300 rounded-lg text-sm">
            </div>

            <button id="tombolMasuk" type="submit"
                class="w-full bg-emerald-600 text-white py-3 rounded-lg
                       font-semibold hover:bg-emerald-700">
                Masuk
            </button>

            <p id="pesan" role="status" aria-live="polite"
                class="text-sm text-center" hidden></p>
        </form>
    </main>

    <script type="module">
        import { tesKoneksi, login, cekSesi } from './app.js';

        const form = document.getElementById('loginForm');
        const tombol = document.getElementById('tombolMasuk');
        const pesan = document.getElementById('pesan');

        function tampilkanPesan(teks, berhasil = false) {
            pesan.hidden = false;
            pesan.textContent = teks;
            pesan.className = berhasil
                ? 'text-sm text-center text-emerald-700'
                : 'text-sm text-center text-red-600';
        }

        async function init() {
            try {
                const sesi = await cekSesi();

                if (sesi) {
                    window.location.replace('dashboard.html');
                    return;
                }
            } catch (error) {
                console.error('Pemeriksaan sesi gagal:', error);
            }

            try {
                const wilayah = await tesKoneksi();

                if (wilayah) {
                    document.getElementById('namaRt').textContent =
                        `RT ${wilayah.rt} / RW ${wilayah.rw}`;

                    document.getElementById('lokasiRt').textContent =
                        `${wilayah.desa_kelurahan}, ${wilayah.kabupaten_kota}`;
                } else {
                    document.getElementById('lokasiRt').textContent =
                        'Pengaturan wilayah belum dapat dimuat';
                }
            } catch (error) {
                console.error('Gagal memuat wilayah:', error);
                document.getElementById('lokasiRt').textContent =
                    'Gagal terhubung ke database';
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            tombol.disabled = true;
            tombol.textContent = 'Memeriksa...';
            pesan.hidden = true;

            try {
                const hasil = await login(
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );

                if (!hasil.success) {
                    tampilkanPesan(
                        hasil.message || 'Login gagal. Periksa email dan kata sandi.'
                    );
                    return;
                }

                tampilkanPesan('Login berhasil. Membuka dashboard...', true);
                window.location.replace('dashboard.html');

            } catch (error) {
                console.error('Kesalahan login:', error);
                tampilkanPesan('Terjadi kesalahan. Silakan coba kembali.');
            } finally {
                tombol.disabled = false;
                tombol.textContent = 'Masuk';
            }
        });

        init();
    </script>
</body>
</html>
