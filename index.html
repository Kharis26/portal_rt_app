
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <title>Portal RT Digital 05</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <main class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-emerald-600 text-white rounded-full flex items-center justify-center font-bold text-xl mx-auto mb-3">
            RT
        </div>

        <h1 class="text-xl font-bold text-slate-800" id="namaRt">
            RT Digital
        </h1>

        <p class="text-sm text-slate-500 mb-6" id="lokasiRt">
            Memuat data wilayah...
        </p>

        <form id="loginForm" class="space-y-4 text-left">
            <div>
                <label for="email" class="text-xs font-semibold text-slate-600 uppercase">
                    Email
                </label>
                <input type="email" id="email" required
                    autocomplete="username"
                    placeholder="Masukkan email terdaftar"
                    class="w-full mt-1 p-3 border border-slate-300 rounded-lg text-sm">
            </div>

            <div>
                <label for="password" class="text-xs font-semibold text-slate-600 uppercase">
                    Kata Sandi
                </label>
                <input type="password" id="password" required
                    autocomplete="current-password"
                    placeholder="Masukkan kata sandi"
                    class="w-full mt-1 p-3 border border-slate-300 rounded-lg text-sm">
            </div>

            <button type="submit" id="tombolMasuk"
                class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">
                Masuk
            </button>

            <p id="pesan" role="status" aria-live="polite"
                class="text-sm text-center" hidden></p>
        </form>
    </main>

    <script type="module">
        import { tesKoneksi, login } from './app.js';

        const pesan = document.getElementById('pesan');
        const tombolMasuk = document.getElementById('tombolMasuk');
        const form = document.getElementById('loginForm');

        function tampilkanPesan(teks, berhasil = false) {
            pesan.hidden = false;
            pesan.textContent = teks;
            pesan.className = berhasil
                ? 'text-sm text-center text-emerald-700'
                : 'text-sm text-center text-red-600';
        }

        async function init() {
            try {
                // Jika sesi masih aktif, langsung buka dashboard.
                const hasil = await login.periksaSesi?.();

                if (hasil?.session) {
                    window.location.replace('dashboard.html');
                    return;
                }
            } catch (error) {
                console.warn('Pemeriksaan sesi:', error);
            }

            try {
                const data = await tesKoneksi();

                if (data) {
                    document.getElementById('namaRt').textContent =
                        `RT ${data.rt} / RW ${data.rw}`;

                    document.getElementById('lokasiRt').textContent =
                        `${data.desa_kelurahan}, ${data.kabupaten_kota}`;
                } else {
                    document.getElementById('lokasiRt').textContent =
                        'Pengaturan wilayah belum dapat dimuat';
                }
            } catch (error) {
                console.error('Gagal memuat wilayah:', error);
                document.getElementById('lokasiRt').textContent =
                    'Gagal terhubung ke database';
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            tombolMasuk.disabled = true;
            tombolMasuk.textContent = 'Memeriksa...';
            pesan.hidden = true;

            try {
                const hasil = await login(email, password);

                if (!hasil || hasil.success !== true) {
                    tampilkanPesan(
                        hasil?.message ||
                        'Login gagal. Periksa email dan kata sandi.'
                    );
                    return;
                }

                tampilkanPesan('Login berhasil. Membuka dashboard...', true);

                // Beri kesempatan pesan sukses ditampilkan sebelum pindah.
                window.location.assign('dashboard.html');

            } catch (error) {
                console.error('Kesalahan login:', error);
                tampilkanPesan(
                    'Terjadi kesalahan saat login. Periksa koneksi dan app.js.'
                );
            } finally {
                tombolMasuk.disabled = false;
                tombolMasuk.textContent = 'Masuk';
            }
        });

        init();
    </script>
</body>
</html>
