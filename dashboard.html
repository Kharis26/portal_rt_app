
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <title>Dashboard Pengurus - RT Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4">
    <main class="max-w-md mx-auto space-y-4">

        <header class="flex justify-between items-center bg-emerald-600
                       text-white p-4 rounded-xl shadow">
            <div>
                <h1 class="font-bold text-lg">Dashboard RT Digital</h1>
                <p id="infoWilayah" class="text-xs opacity-90">
                    Dashboard Pengurus
                </p>
            </div>
            <button id="btnLogout"
                class="bg-emerald-700 text-xs px-3 py-2 rounded-lg">
                Keluar
            </button>
        </header>

        <div id="statusDashboard" role="status" aria-live="polite"
            class="hidden bg-white p-3 rounded-xl text-sm">
        </div>

        <section class="grid grid-cols-2 gap-3">
            <a href="warga.html"
                class="bg-white p-4 rounded-xl shadow border-l-4
                       border-emerald-500">
                <p class="text-xs text-slate-500 font-semibold">Warga Aktif</p>
                <p id="totalWarga" class="text-xl font-bold mt-1">Memuat...</p>
            </a>

            <a href="warga.html"
                class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                <p class="text-xs text-slate-500 font-semibold">Total KK</p>
                <p id="totalKK" class="text-xl font-bold mt-1">Memuat...</p>
            </a>
        </section>

        <section class="bg-white p-4 rounded-xl shadow border-l-4 border-amber-500">
            <p class="text-xs text-slate-500 font-semibold">Saldo Kas RT</p>
            <p id="saldoKas" class="text-2xl font-bold mt-1">Memuat...</p>
        </section>

        <section>
            <h2 class="font-bold text-slate-700 mb-3">Menu Utama</h2>
            <div class="grid grid-cols-2 gap-3">
                <a href="warga.html"
                    class="bg-white p-4 rounded-xl shadow text-center
                           text-sm font-semibold border border-slate-200">
                    <span class="block text-2xl mb-2">👥</span>
                    Data Warga & KK
                </a>

                <button id="btnKas" type="button"
                    class="bg-white p-4 rounded-xl shadow text-center
                           text-sm font-semibold border border-slate-200">
                    <span class="block text-2xl mb-2">💰</span>
                    Iuran & Kas RT
                </button>
            </div>
        </section>

        <button id="btnRefresh" type="button"
            class="w-full bg-white p-3 rounded-xl shadow
                   border border-slate-200 text-sm font-semibold text-emerald-700">
            ↻ Perbarui Data
        </button>
    </main>

    <script type="module">
        import { supabase, cekSesi, logout, tesKoneksi } from './app.js';

        const $ = id => document.getElementById(id);
        let memuat = false;

        function status(teks, error = false) {
            const box = $('statusDashboard');
            box.textContent = teks;
            box.classList.remove('hidden', 'text-red-700', 'text-emerald-700');
            box.classList.add(error ? 'text-red-700' : 'text-emerald-700');
        }

        function rupiah(nilai) {
            const n = Number(nilai);
            if (!Number.isFinite(n)) {
                throw new Error('Nilai saldo tidak valid.');
            }
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(n);
        }

        async function muatDashboard() {
            if (memuat) return;
            memuat = true;
            $('btnRefresh').disabled = true;

            try {
                const sesi = await cekSesi();

                if (!sesi) {
                    window.location.replace('index.html');
                    return;
                }

                const [kk, warga, kas, wilayah] = await Promise.all([
                    supabase.from('households')
                        .select('id', { count: 'exact', head: true }),

                    supabase.from('residents')
                        .select('id', { count: 'exact', head: true })
                        .eq('is_active', true),

                    supabase.from('view_saldo_kas')
                        .select('saldo_saat_ini')
                        .maybeSingle(),

                    tesKoneksi()
                ]);

                if (kk.error) throw new Error('Data KK: ' + kk.error.message);
                if (warga.error) throw new Error('Data warga: ' + warga.error.message);
                if (kas.error) throw new Error('Saldo kas: ' + kas.error.message);

                $('totalKK').textContent =
                    `${(kk.count ?? 0).toLocaleString('id-ID')} KK`;

                $('totalWarga').textContent =
                    `${(warga.count ?? 0).toLocaleString('id-ID')} Jiwa`;

                $('saldoKas').textContent = kas.data
                    ? rupiah(kas.data.saldo_saat_ini)
                    : 'Belum tersedia';

                if (wilayah) {
                    $('infoWilayah').textContent =
                        `RT ${wilayah.rt} / RW ${wilayah.rw} · ${wilayah.desa_kelurahan}`;
                }

                status('Data dashboard berhasil dimuat.');

            } catch (error) {
                console.error('Dashboard error:', error);
                status(error.message || 'Gagal memuat dashboard.', true);
                $('totalKK').textContent = 'Gagal dimuat';
                $('totalWarga').textContent = 'Gagal dimuat';
                $('saldoKas').textContent = 'Gagal dimuat';
            } finally {
                memuat = false;
                $('btnRefresh').disabled = false;
            }
        }

        $('btnLogout').addEventListener('click', async () => {
            $('btnLogout').disabled = true;

            try {
                const hasil = await logout();

                if (!hasil.success) {
                    throw new Error(hasil.message || 'Logout gagal.');
                }

                window.location.replace('index.html');
            } catch (error) {
                status(error.message, true);
                $('btnLogout').disabled = false;
            }
        });

        $('btnRefresh').addEventListener('click', muatDashboard);

        $('btnKas').addEventListener('click', () => {
            status('Halaman Iuran & Kas belum dibuat.');
        });

        muatDashboard();
    </script>
</body>
</html>
