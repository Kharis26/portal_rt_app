HTML

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <title>Dashboard Pengurus - RT Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4">
    <main class="max-w-md mx-auto space-y-4">

        <header class="flex justify-between items-center bg-emerald-600
                       text-white p-4 rounded-xl shadow">
            <div>
                <h1 class="font-bold text-lg">Dashboard RT Digital</h1>
                <p id="infoWilayah" class="text-xs opacity-90">
                    Memuat wilayah...
                </p>
            </div>
            <button id="btnLogout" type="button"
                class="bg-emerald-700 text-xs px-3 py-2 rounded-lg">
                Keluar
            </button>
        </header>

        <div id="statusDashboard" role="status" aria-live="polite"
            class="bg-white p-3 rounded-xl text-sm text-slate-600">
            Memeriksa sesi dan memuat data...
        </div>

        <section class="grid grid-cols-2 gap-3">
            <a href="warga.html"
                class="bg-white p-4 rounded-xl shadow border-l-4 border-emerald-500">
                <p class="text-xs text-slate-500 font-semibold">Warga Aktif</p>
                <p id="totalWarga" class="text-xl font-bold mt-1">Memuat...</p>
            </a>

            <a href="warga.html"
                class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                <p class="text-xs text-slate-500 font-semibold">Total KK</p>
                <p id="totalKK" class="text-xl font-bold mt-1">Memuat...</p>
            </a>
        </section>

        <section class="bg-white p-4 rounded-xl shadow border-l-4 border-amber-500">
            <p class="text-xs text-slate-500 font-semibold">Saldo Kas RT</p>
            <p id="saldoKas" class="text-2xl font-bold mt-1">Memuat...</p>
        </section>

        <section>
            <h2 class="font-bold text-slate-700 mb-3">Menu Utama</h2>

            <div class="grid grid-cols-2 gap-3">
                <a href="warga.html"
                    class="bg-white p-4 rounded-xl shadow text-center
                           text-sm font-semibold border border-slate-200">
                    <span class="block text-2xl mb-2">👥</span>
                    Data Warga & KK
                </a>

                <button id="btnKas" type="button"
                    class="bg-white p-4 rounded-xl shadow text-center
                           text-sm font-semibold border border-slate-200">
                    <span class="block text-2xl mb-2">💰</span>
                    Iuran & Kas RT
                </button>
            </div>
        </section>

        <button id="btnRefresh" type="button"
            class="w-full bg-white p-3 rounded-xl shadow
                   border border-slate-200 text-sm font-semibold text-emerald-700">
            ↻ Perbarui Data
        </button>

    </main>

    <script type="module">
        import {
            cekSesi,
            logout,
            tesKoneksi,
            muatRingkasanDashboard
        } from './app.js';

        const $ = id => document.getElementById(id);

        let sedangMemuat = false;

        function tampilkanStatus(teks, error = false) {
            const box = $('statusDashboard');

            box.textContent = teks;
            box.className = error
                ? 'bg-white p-3 rounded-xl text-sm text-red-700'
                : 'bg-white p-3 rounded-xl text-sm text-emerald-700';
        }

        function formatRupiah(nilai) {
            const angka = Number(nilai);

            if (!Number.isFinite(angka)) {
                throw new Error('Nilai saldo kas tidak valid.');
            }

            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(angka);
        }

        async function muatDashboard() {
            if (sedangMemuat) return;

            sedangMemuat = true;
            $('btnRefresh').disabled = true;
            $('totalWarga').textContent = 'Memuat...';
            $('totalKK').textContent = 'Memuat...';
            $('saldoKas').textContent = 'Memuat...';

            try {
                // Pastikan pengguna sudah login.
                const sesi = await cekSesi();

                if (!sesi) {
                    window.location.replace('index.html');
                    return;
                }

                // Ambil ringkasan dan pengaturan wilayah.
                const [ringkasan, wilayah] = await Promise.all([
                    muatRingkasanDashboard(),
                    tesKoneksi()
                ]);

                // Tampilkan data hasil database.
                $('totalWarga').textContent =
                    `${ringkasan.totalWarga.toLocaleString('id-ID')} Jiwa`;

                $('totalKK').textContent =
                    `${ringkasan.totalKK.toLocaleString('id-ID')} KK`;

                $('saldoKas').textContent =
                    formatRupiah(ringkasan.saldoKas);

                if (wilayah) {
                    $('infoWilayah').textContent =
                        `RT ${wilayah.rt} / RW ${wilayah.rw} · ` +
                        `${wilayah.desa_kelurahan}, ` +
                        `${wilayah.kabupaten_kota}`;
                } else {
                    $('infoWilayah').textContent = 'RT Digital';
                }

                tampilkanStatus('Data dashboard berhasil dimuat.');

            } catch (error) {
                console.error('Kesalahan dashboard:', error);

                $('totalWarga').textContent = '—';
                $('totalKK').textContent = '—';
                $('saldoKas').textContent = '—';

                tampilkanStatus(
                    'Gagal memuat data: ' +
                    (error.message || 'Kesalahan tidak diketahui.') +
                    ' Tekan Perbarui Data untuk mencoba kembali.',
                    true
                );
            } finally {
                sedangMemuat = false;
                $('btnRefresh').disabled = false;
            }
        }

        // Logout dengan penanganan error.
        $('btnLogout').addEventListener('click', async () => {
            $('btnLogout').disabled = true;

            try {
                await logout();
                window.location.replace('index.html');
            } catch (error) {
                tampilkanStatus(
                    'Logout gagal: ' + error.message,
                    true
                );
                $('btnLogout').disabled = false;
            }
        });

        $('btnRefresh').addEventListener('click', muatDashboard);

        $('btnKas').addEventListener('click', () => {
            tampilkanStatus(
                'Menu Iuran & Kas RT belum terhubung ke halaman transaksi.'
            );
        });

        muatDashboard();
    </script>
</body>
</html>
