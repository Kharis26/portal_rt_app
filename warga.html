
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Warga & KK - RT Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-4 min-h-screen pb-20">
    <div class="max-w-md mx-auto space-y-4">

        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
            <div>
                <h1 class="font-bold text-slate-800 text-lg">
                    Data Warga & KK
                </h1>
                <p class="text-xs text-slate-500">
                    <span id="totalKkHead">0</span> KK |
                    <span id="totalWargaHead">0</span> Jiwa
                </p>
            </div>

            <a href="dashboard.html"
               class="text-xs bg-slate-200 px-3 py-2 rounded-lg text-slate-700 font-medium">
                Kembali
            </a>
        </div>

        <div class="flex gap-2">
            <input
                type="text"
                id="searchInput"
                placeholder="Cari nama / blok..."
                class="w-full min-w-0 p-2.5 border border-slate-300 rounded-lg text-xs bg-white"
            >

            <button
                id="btnTambah"
                type="button"
                class="bg-emerald-600 text-white text-xs px-4 py-2.5 rounded-lg font-semibold whitespace-nowrap">
                + Tambah KK
            </button>
        </div>

        <div id="pesanStatus"
             class="hidden bg-white p-3 rounded-xl text-sm"
             role="status">
        </div>

        <div id="daftarWarga" class="space-y-3">
            <p class="text-xs text-slate-500 text-center py-4">
                Memuat data warga...
            </p>
        </div>

        <button
            id="btnMuatUlang"
            type="button"
            class="w-full bg-white p-3 rounded-xl shadow text-emerald-700 font-semibold text-sm">
            ↻ Muat Ulang Data
        </button>
    </div>

    <script type="module">
        import { supabase } from './app.js';

        const container = document.getElementById('daftarWarga');
        const statusBox = document.getElementById('pesanStatus');
        const searchInput = document.getElementById('searchInput');

        let semuaKK = [];

        function tampilkanStatus(pesan, jenis = 'info') {
            statusBox.classList.remove(
                'hidden',
                'text-red-700',
                'text-emerald-700',
                'text-slate-600'
            );

            statusBox.classList.add(
                jenis === 'error'
                    ? 'text-red-700'
                    : jenis === 'success'
                    ? 'text-emerald-700'
                    : 'text-slate-600'
            );

            statusBox.textContent = pesan;
        }

        function buatElemen(tag, className, teks) {
            const el = document.createElement(tag);
            el.className = className;
            el.textContent = teks ?? '';
            return el;
        }

        function formatNIK(nik) {
            if (!nik) return 'NIK belum diisi';

            const nilai = String(nik);

            if (nilai.length < 8) return 'NIK: ' + nilai;

            return nilai.slice(0, 4)
                + '••••••••'
                + nilai.slice(-4);
        }

        async function muatDataWarga() {
            container.replaceChildren(
                buatElemen(
                    'p',
                    'text-xs text-slate-500 text-center py-4',
                    'Memuat data warga...'
                )
            );

            tampilkanStatus('Menghubungkan ke database...');

            try {
                const { data, error } = await supabase
                    .from('households')
                    .select(`
                        id,
                        blok,
                        status_hunian,
                        no_kk,
                        residents (
                            id,
                            nama_lengkap,
                            status_keluarga,
                            nik,
                            is_active
                        )
                    `)
                    .order('blok', { ascending: true });

                if (error) {
                    throw error;
                }

                if (!Array.isArray(data)) {
                    throw new Error(
                        'Respons data KK tidak sesuai format.'
                    );
                }

                semuaKK = data.map(kk => ({
                    ...kk,
                    residents: (kk.residents || []).filter(
                        warga => warga.is_active === true
                    )
                }));

                const totalWarga = semuaKK.reduce(
                    (total, kk) => total + kk.residents.length,
                    0
                );

                document.getElementById('totalKkHead').textContent =
                    semuaKK.length;

                document.getElementById('totalWargaHead').textContent =
                    totalWarga;

                tampilkanDaftar();

                tampilkanStatus(
                    'Data berhasil dimuat dari Supabase.',
                    'success'
                );

            } catch (error) {
                console.error('Gagal memuat Data Warga & KK:', error);

                semuaKK = [];
                document.getElementById('totalKkHead').textContent = '0';
                document.getElementById('totalWargaHead').textContent = '0';

                container.replaceChildren(
                    buatElemen(
                        'p',
                        'bg-white p-4 rounded-xl shadow text-sm text-red-700',
                        'Gagal memuat data: ' +
                        (error.message || 'Kesalahan tidak diketahui')
                    )
                );

                tampilkanStatus(
                    'Pemuatan data gagal. Periksa pesan error pada halaman.',
                    'error'
                );
            }
        }

        function tampilkanDaftar() {
            const kata = searchInput.value.trim().toLowerCase();

            const hasil = semuaKK.filter(kk => {
                const blok = String(kk.blok ?? '').toLowerCase();

                const cocokBlok = blok.includes(kata);

                const cocokNama = kk.residents.some(warga =>
                    String(warga.nama_lengkap ?? '')
                        .toLowerCase()
                        .includes(kata)
                );

                return !kata || cocokBlok || cocokNama;
            });

            container.replaceChildren();

            if (hasil.length === 0) {
                container.appendChild(
                    buatElemen(
                        'div',
                        'bg-white p-4 rounded-xl shadow text-center text-sm text-slate-500',
                        semuaKK.length === 0
                            ? 'Belum ada data KK.'
                            : 'Tidak ada data yang cocok dengan pencarian.'
                    )
                );
                return;
            }

            hasil.forEach(kk => {
                const kepala = kk.residents.find(
                    warga =>
                        warga.status_keluarga === 'Kepala Keluarga'
                );

                const kartu = document.createElement('div');
                kartu.className = 'bg-white p-4 rounded-xl shadow';

                const barisAtas = document.createElement('div');
                barisAtas.className =
                    'flex justify-between items-start gap-2';

                const bagianNama = document.createElement('div');
                bagianNama.className = 'min-w-0';

                bagianNama.appendChild(
                    buatElemen(
                        'h3',
                        'font-bold text-sm text-slate-800 break-words',
                        kepala?.nama_lengkap || 'Kepala keluarga belum diisi'
                    )
                );

                bagianNama.appendChild(
                    buatElemen(
                        'p',
                        'text-xs text-slate-500 mt-1',
                        'Blok ' + (kk.blok || '-')
                    )
                );

                bagianNama.appendChild(
                    buatElemen(
                        'p',
                        'text-xs text-slate-500 mt-1',
                        kk.residents.length + ' warga aktif'
                    )
                );

                const statusHunian = kk.status_hunian || 'Belum diisi';

                const badge = buatElemen(
                    'span',
                    'text-[10px] px-2 py-1 rounded-lg shrink-0 ' +
                    (statusHunian === 'Tetap'
                        ? 'bg-emerald-100 text-emerald-800'
                        : 'bg-amber-100 text-amber-800'),
                    statusHunian
                );

                barisAtas.append(bagianNama, badge);
                kartu.appendChild(barisAtas);

                if (kepala?.nik) {
                    kartu.appendChild(
                        buatElemen(
                            'p',
                            'text-[11px] text-slate-400 font-mono mt-2',
                            formatNIK(kepala.nik)
                        )
                    );
                }

                const daftarAnggota = document.createElement('div');
                daftarAnggota.className =
                    'border-t border-slate-100 mt-3 pt-3 space-y-2';

                if (kk.residents.length === 0) {
                    daftarAnggota.appendChild(
                        buatElemen(
                            'p',
                            'text-xs text-slate-500',
                            'Belum ada warga aktif yang terhubung ke KK ini.'
                        )
                    );
                } else {
                    kk.residents.forEach(warga => {
                        const nama = warga.nama_lengkap || 'Nama belum diisi';
                        const hubungan = warga.status_keluarga || 'Anggota';

                        daftarAnggota.appendChild(
                            buatElemen(
                                'p',
                                'text-xs text-slate-700',
                                nama + ' — ' + hubungan
                            )
                        );
                    });
                }

                kartu.appendChild(daftarAnggota);
                container.appendChild(kartu);
            });
        }

        searchInput.addEventListener('input', tampilkanDaftar);

        document.getElementById('btnMuatUlang')
            .addEventListener('click', muatDataWarga);

        document.getElementById('btnTambah')
            .addEventListener('click', () => {
                alert(
                    'Fitur tambah KK belum diaktifkan. ' +
                    'Data tidak diubah.'
                );
            });

        muatDataWarga();
    </script>
</body>
</html>
