HTML

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f5f9">
    <title>Data Warga & KK - RT Digital 05</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-4 min-h-screen pb-20">
    <main class="max-w-md mx-auto space-y-4">

        <!-- Header -->
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
            <div>
                <h1 class="font-bold text-slate-800 text-lg">
                    Data Warga & KK
                </h1>
                <p class="text-xs text-slate-500 mt-1">
                    <span id="totalKkHead">0</span> KK |
                    <span id="totalWargaHead">0</span> Jiwa
                </p>
            </div>

            <a href="dashboard.html"
               class="text-xs bg-slate-200 px-3 py-2 rounded-lg text-slate-700 font-medium">
                Kembali
            </a>
        </header>

        <!-- Pencarian dan tombol tambah -->
        <div class="flex gap-2">
            <input
                type="search"
                id="searchInput"
                placeholder="Cari nama / blok..."
                aria-label="Cari nama warga atau blok"
                class="w-full min-w-0 p-3 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >

            <button
                id="btnTambah"
                type="button"
                class="bg-emerald-600 text-white text-xs px-4 py-2 rounded-lg font-semibold whitespace-nowrap">
                + Tambah KK
            </button>
        </div>

        <!-- Status -->
        <div id="pesanStatus"
             class="hidden bg-white p-3 rounded-xl text-sm break-words"
             role="status"
             aria-live="polite">
        </div>

        <!-- Daftar KK -->
        <section id="daftarWarga" class="space-y-3">
            <p class="text-sm text-slate-500 text-center py-4">
                Menyiapkan halaman...
            </p>
        </section>

        <!-- Muat ulang -->
        <button
            id="btnMuatUlang"
            type="button"
            class="w-full bg-white p-3 rounded-xl shadow text-emerald-700 font-semibold text-sm">
            ↻ Muat Ulang Data
        </button>
    </main>

    <script type="module">
        import { supabase } from './app.js';

        const container = document.getElementById('daftarWarga');
        const statusBox = document.getElementById('pesanStatus');
        const searchInput = document.getElementById('searchInput');
        const totalKkHead = document.getElementById('totalKkHead');
        const totalWargaHead = document.getElementById('totalWargaHead');
        const btnMuatUlang = document.getElementById('btnMuatUlang');

        let semuaKK = [];
        let sedangMemuat = false;

        function buatElemen(tag, className = '', teks = '') {
            const el = document.createElement(tag);
            el.className = className;
            el.textContent = teks;
            return el;
        }

        function tampilkanStatus(pesan, jenis = 'info') {
            statusBox.className = 'bg-white p-3 rounded-xl text-sm break-words';

            if (jenis === 'error') {
                statusBox.classList.add('text-red-700');
            } else if (jenis === 'success') {
                statusBox.classList.add('text-emerald-700');
            } else {
                statusBox.classList.add('text-slate-600');
            }

            statusBox.textContent = pesan;
        }

        function formatNIK(nik) {
            if (!nik) return 'NIK belum diisi';

            const nilai = String(nik);

            if (nilai.length < 8) {
                return 'NIK: ' + nilai;
            }

            return nilai.slice(0, 4) +
                '••••••••' +
                nilai.slice(-4);
        }

        function formatError(error) {
            if (!error) return 'Kesalahan tidak diketahui.';

            const kode = error.code ? '[' + error.code + '] ' : '';
            return kode + (error.message || String(error));
        }

        async function denganBatasWaktu(promise, nama, ms = 15000) {
            let timer;

            try {
                return await Promise.race([
                    promise,
                    new Promise((_, reject) => {
                        timer = setTimeout(() => {
                            reject(new Error(
                                nama + ' tidak merespons dalam 15 detik. Periksa koneksi internet.'
                            ));
                        }, ms);
                    })
                ]);
            } finally {
                clearTimeout(timer);
            }
        }

        async function muatDataWarga() {
            if (sedangMemuat) return;

            sedangMemuat = true;
            btnMuatUlang.disabled = true;
            btnMuatUlang.textContent = 'Memuat data...';

            container.replaceChildren(
                buatElemen(
                    'p',
                    'text-sm text-slate-500 text-center py-4',
                    'Memuat data KK...'
                )
            );

            tampilkanStatus('Menghubungkan ke Supabase...');

            try {
                /*
                 * TAHAP 1:
                 * Baca tabel households saja, tanpa relasi residents.
                 * Ini membantu membedakan masalah akses KK dari masalah relasi.
                 */
                const hasilKK = await denganBatasWaktu(
                    supabase
                        .from('households')
                        .select('id, blok, status_hunian, no_kk')
                        .order('blok', { ascending: true }),
                    'Data KK'
                );

                if (hasilKK.error) {
                    throw new Error(
                        'Gagal membaca tabel households: ' +
                        formatError(hasilKK.error)
                    );
                }

                if (!Array.isArray(hasilKK.data)) {
                    throw new Error(
                        'Respons data KK tidak sesuai format.'
                    );
                }

                const dataKK = hasilKK.data;

                /*
                 * TAHAP 2:
                 * Jika tidak ada KK yang terlihat oleh aplikasi,
                 * tampilkan status khusus. Jangan menganggapnya sukses.
                 */
                if (dataKK.length === 0) {
                    semuaKK = [];
                    totalKkHead.textContent = '0';
                    totalWargaHead.textContent = '0';

                    container.replaceChildren(
                        buatElemen(
                            'div',
                            'bg-white p-4 rounded-xl shadow text-center text-sm text-slate-600',
                            'Query berhasil tetapi tidak ada KK yang dapat dibaca oleh aplikasi. Periksa sesi login dan kebijakan akses Supabase.'
                        )
                    );

                    tampilkanStatus(
                        'Data KK kosong pada hasil aplikasi. Database sebelumnya menunjukkan 3 KK; kita perlu memeriksa akses baca dari website.',
                        'error'
                    );

                    return;
                }

                /*
                 * TAHAP 3:
                 * Ambil data warga secara terpisah.
                 * Tidak memakai nested select residents(...).
                 */
                const idKK = dataKK.map(kk => kk.id);

                const hasilWarga = await denganBatasWaktu(
                    supabase
                        .from('residents')
                        .select(
                            'id, household_id, nama_lengkap, status_keluarga, nik, is_active'
                        )
                        .in('household_id', idKK),
                    'Data warga'
                );

                if (hasilWarga.error) {
                    throw new Error(
                        'Data KK terbaca, tetapi data warga gagal dimuat: ' +
                        formatError(hasilWarga.error)
                    );
                }

                const daftarWarga = Array.isArray(hasilWarga.data)
                    ? hasilWarga.data
                    : [];

                /*
                 * TAHAP 4:
                 * Hubungkan warga ke KK melalui household_id.
                 */
                semuaKK = dataKK.map(kk => ({
                    ...kk,
                    residents: daftarWarga.filter(
                        warga =>
                            warga.household_id === kk.id &&
                            warga.is_active === true
                    )
                }));

                const totalWarga = semuaKK.reduce(
                    (total, kk) => total + kk.residents.length,
                    0
                );

                totalKkHead.textContent = String(semuaKK.length);
                totalWargaHead.textContent = String(totalWarga);

                tampilkanDaftar();

                tampilkanStatus(
                    'Berhasil membaca ' + semuaKK.length +
                    ' KK dan ' + totalWarga + ' warga aktif.',
                    'success'
                );

            } catch (error) {
                console.error('Gagal memuat Data Warga & KK:', error);

                semuaKK = [];
                totalKkHead.textContent = '0';
                totalWargaHead.textContent = '0';

                container.replaceChildren(
                    buatElemen(
                        'div',
                        'bg-white p-4 rounded-xl shadow text-sm text-red-700 break-words',
                        formatError(error)
                    )
                );

                tampilkanStatus(
                    'Pemuatan data gagal. Baca pesan error di atas untuk menentukan perbaikannya.',
                    'error'
                );

            } finally {
                sedangMemuat = false;
                btnMuatUlang.disabled = false;
                btnMuatUlang.textContent = '↻ Muat Ulang Data';
            }
        }

        function tampilkanDaftar() {
            const kata = searchInput.value.trim().toLowerCase();

            const hasil = semuaKK.filter(kk => {
                const blok = String(kk.blok ?? '').toLowerCase();
                const noKK = String(kk.no_kk ?? '').toLowerCase();

                const cocokBlok = blok.includes(kata);
                const cocokNomor = noKK.includes(kata);

                const cocokNama = kk.residents.some(warga =>
                    String(warga.nama_lengkap ?? '')
                        .toLowerCase()
                        .includes(kata)
                );

                return !kata || cocokBlok || cocokNomor || cocokNama;
            });

            container.replaceChildren();

            if (hasil.length === 0) {
                container.appendChild(
                    buatElemen(
                        'div',
                        'bg-white p-4 rounded-xl shadow text-center text-sm text-slate-500',
                        semuaKK.length === 0
                            ? 'Belum ada KK yang dapat ditampilkan.'
                            : 'Tidak ada data yang cocok dengan pencarian.'
                    )
                );
                return;
            }

            hasil.forEach(kk => {
                const kepala = kk.residents.find(
                    warga =>
                        String(warga.status_keluarga || '')
                            .toLowerCase() === 'kepala keluarga'
                );

                const kartu = buatElemen(
                    'article',
                    'bg-white p-4 rounded-xl shadow'
                );

                const barisAtas = buatElemen(
                    'div',
                    'flex justify-between items-start gap-2'
                );

                const bagianNama = buatElemen('div', 'min-w-0');

                bagianNama.appendChild(
                    buatElemen(
                        'h3',
                        'font-bold text-sm text-slate-800 break-words',
                        kepala?.nama_lengkap ||
                        'Kepala keluarga belum diisi'
                    )
                );

                bagianNama.appendChild(
                    buatElemen(
                        'p',
                        'text-xs text-slate-500 mt-1',
                        'Blok ' + (kk.blok || '-')
                    )
                );

                bagianNama.appendChild(
                    buatElemen(
                        'p',
                        'text-xs text-slate-500 mt-1',
                        kk.residents.length + ' warga aktif'
                    )
                );

                if (kk.no_kk) {
                    bagianNama.appendChild(
                        buatElemen(
                            'p',
                            'text-xs text-slate-400 mt-1',
                            'Nomor KK: ' + String(kk.no_kk)
                        )
                    );
                }

                const statusHunian = kk.status_hunian || 'Belum diisi';

                const badge = buatElemen(
                    'span',
                    'text-[10px] px-2 py-1 rounded-lg shrink-0 ' +
                    (statusHunian === 'Tetap'
                        ? 'bg-emerald-100 text-emerald-800'
                        : 'bg-amber-100 text-amber-800'),
                    statusHunian
                );

                barisAtas.append(bagianNama, badge);
                kartu.appendChild(barisAtas);

                if (kepala?.nik) {
                    kartu.appendChild(
                        buatElemen(
                            'p',
                            'text-[11px] text-slate-400 font-mono mt-2',
                            formatNIK(kepala.nik)
                        )
                    );
                }

                const daftarAnggota = buatElemen(
                    'div',
                    'border-t border-slate-100 mt-3 pt-3 space-y-2'
                );

                if (kk.residents.length === 0) {
                    daftarAnggota.appendChild(
                        buatElemen(
                            'p',
                            'text-xs text-slate-500',
                            'Belum ada warga aktif yang terhubung ke KK ini.'
                        )
                    );
                } else {
                    kk.residents.forEach(warga => {
                        const nama =
                            warga.nama_lengkap || 'Nama belum diisi';
                        const hubungan =
                            warga.status_keluarga || 'Anggota';

                        daftarAnggota.appendChild(
                            buatElemen(
                                'p',
                                'text-xs text-slate-700 break-words',
                                nama + ' — ' + hubungan
                            )
                        );
                    });
                }

                kartu.appendChild(daftarAnggota);
                container.appendChild(kartu);
            });
        }

        searchInput.addEventListener('input', tampilkanDaftar);

        btnMuatUlang.addEventListener('click', muatDataWarga);

        document.getElementById('btnTambah')
            .addEventListener('click', () => {
                alert(
                    'Fitur tambah KK belum diaktifkan. ' +
                    'Data tidak diubah.'
                );
            });

        muatDataWarga();
    </script>
</body>
</html>
